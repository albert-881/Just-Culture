<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms — Harlingen Medical Center</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Serif+Display&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #8E0C3A;
      --accent:  #8E0C3A;
      --deep:    #5E0726;
      --soft-bg: #F5F5F5;
      --white:   #FFFFFF;
      --border:  #D9D9D9;
      --muted:   #6F6F6F;
      --tint:    #F9EEF2;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--soft-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 20px;
    }

    .hub-header {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      text-align: center;
    }
    .hub-header img { height: 44px; max-width: 100%; }
    .hub-header h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-weight: 400;
      font-size: 1.6rem;
      color: var(--navy);
    }

    .hub {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex: 1;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      gap: 16px;
    }
    .hub > * { flex: 0 1 240px; }

    /* Program button */
    .program-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px 16px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--deep) 100%);
      color: var(--white);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-decoration: none;
      box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 4px 12px rgba(94, 7, 38, 0.22);
      transition: transform 0.18s, box-shadow 0.18s;
    }
    a.program-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 10px 22px rgba(94, 7, 38, 0.3);
    }
    a.program-btn:active { transform: translateY(0); }
    a.program-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .btn-icon {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.16);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.18s, transform 0.18s;
    }
    a.program-btn:hover .btn-icon { background: rgba(255,255,255,0.28); transform: translateX(3px); }

    /* Coming soon */
    .program-btn.soon {
      background: var(--white);
      color: var(--muted);
      border: 1px dashed var(--border);
      box-shadow: none;
      cursor: default;
    }
    .soon-tag { font-size: 0.72rem; font-weight: 500; }

    .hub-footer { margin-top: 24px; font-size: 0.75rem; color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      a.program-btn:hover, a.program-btn:hover .btn-icon { transform: none; }
    }
  </style>
</head>
<body>

  <header class="hub-header">
    <img src="HMC_logo_transparent.png" alt="Harlingen Medical Center">
    <h1>HMC Forms</h1>
  </header>

  <main class="hub" id="hub"></main>

  <footer class="hub-footer">Harlingen Medical Center</footer>

  <script>
    // ─────────────────────────────────────────────────────────────
    //  PROGRAMS CONFIG — one button per program.
    //  To add a program, add one line below.
    //
    //  name    button text
    //  href    page the button opens
    //  status  optional: "soon" shows it greyed out, not clickable
    // ─────────────────────────────────────────────────────────────
    const PROGRAMS = [
      { name: 'Just Culture', href: 'justCultureAlgorithm.html' }
      // { name: 'Another Program', href: 'anotherProgram.html', status: 'soon' }
    ];

    // ── Render ───────────────────────────────────────────────────
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }
    const chevron = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

    document.getElementById('hub').innerHTML = PROGRAMS.map(p =>
      p.status === 'soon'
        ? `<div class="program-btn soon" aria-disabled="true">${esc(p.name)}<span class="soon-tag">Coming soon</span></div>`
        : `<a class="program-btn" href="${esc(p.href)}">${esc(p.name)}<span class="btn-icon">${chevron}</span></a>`
    ).join('');
  </script>

</body>
</html>
