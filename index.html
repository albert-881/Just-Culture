<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms — Harlingen Medical Center</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Serif+Display&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #8E0C3A;
      --steel:   #000000;
      --accent:  #8E0C3A;
      --soft-bg: #F5F5F5;
      --white:   #FFFFFF;
      --border:  #C8C8C8;
      --text:    #000000;
      --muted:   #6F6F6F;
      --tint:    #F9EEF2;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--soft-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 80px;
    }

    .hub-header {
      width: 100%;
      max-width: 720px;
      margin-bottom: 36px;
      text-align: center;
    }
    .hub-header img { height: 60px; margin-bottom: 24px; max-width: 100%; }
    .hub-header h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-weight: 400;
      font-size: 2.5rem;
      line-height: 1.1;
      color: var(--navy);
      margin-bottom: 12px;
    }
    .hub-header p {
      font-size: 0.98rem;
      color: var(--muted);
      line-height: 1.65;
      max-width: 460px;
      margin: 0 auto;
    }

    .hub { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 28px; }

    .group {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .group-head {
      padding: 22px 28px 18px;
      border-bottom: 1px solid var(--border);
      border-top: 4px solid var(--accent);
    }
    .group-head h2 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-weight: 400;
      font-size: 1.35rem;
      color: var(--navy);
    }
    .group-head p { font-size: 0.86rem; color: var(--muted); margin-top: 4px; line-height: 1.55; }

    .form-list { list-style: none; }
    .form-list li + li { border-top: 1px solid #E6E6E6; }

    .form-link {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 20px 28px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }
    a.form-link:hover { background: var(--tint); }
    a.form-link:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

    .form-code {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .form-title { font-size: 1rem; font-weight: 600; color: var(--navy); }
    .form-desc { font-size: 0.86rem; color: var(--muted); line-height: 1.55; margin-top: 3px; }
    .form-go { color: var(--accent); display: flex; transition: transform 0.15s; }
    a.form-link:hover .form-go { transform: translateX(3px); }

    .form-link.soon { cursor: default; }
    .form-link.soon .form-code { background: var(--border); }
    .form-link.soon .form-title { color: var(--muted); }
    .soon-tag {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 4px 10px;
      white-space: nowrap;
    }

    .hub-footer { margin-top: 36px; font-size: 0.78rem; color: var(--muted); text-align: center; }

    @media (max-width: 520px) {
      .hub-header h1 { font-size: 2rem; }
      .group-head, .form-link { padding-left: 20px; padding-right: 20px; }
      .form-link { gap: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <header class="hub-header">
    <img src="HMC_logo_transparent.png" alt="Harlingen Medical Center">
    <h1>HMC Forms</h1>
    <p>Choose a form to get started. Forms are grouped by program.</p>
  </header>

  <main class="hub" id="hub"></main>

  <footer class="hub-footer">Harlingen Medical Center</footer>

  <script>
    // ─────────────────────────────────────────────────────────────
    //  FORMS CONFIG — to add a form, add an entry to a group's
    //  "forms" list (or add a new group). Nothing else needs to change.
    //
    //  code        short badge text (e.g. "A", "B", "C")
    //  title       form name shown to users
    //  description one line on what the form is for
    //  href        page to open
    //  status      optional: "soon" shows it greyed out, not clickable
    // ─────────────────────────────────────────────────────────────
    const FORM_GROUPS = [
      {
        name: 'Just Culture',
        description: 'Event review. Complete Attachment A first, then Attachment B for the same event.',
        forms: [
          {
            code: 'A',
            title: 'Just Culture Algorithm',
            description: 'Answer guided questions to determine the outcome of an event.',
            href: 'justCultureAlgorithm.html'
          },
          {
            code: 'B',
            title: 'Leadership Documentation',
            description: 'Document the action plan, HR escalation, and signatures, linked to Attachment A.',
            href: 'leadershipDocumentation.html'
          }
        ]
      }
      // Example of a future group:
      // {
      //   name: 'Another Program',
      //   description: '',
      //   forms: [
      //     { code: 'C', title: 'New Form', description: 'What it is for.', href: 'newForm.html', status: 'soon' }
      //   ]
      // }
    ];

    // ── Render ───────────────────────────────────────────────────
    const chevron = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    function renderForm(f) {
      const soon = f.status === 'soon';
      const inner = `
        <div class="form-code" aria-hidden="true">${esc(f.code)}</div>
        <div>
          <div class="form-title">${esc(f.title)}</div>
          ${f.description ? `<div class="form-desc">${esc(f.description)}</div>` : ''}
        </div>
        ${soon ? '<span class="soon-tag">Coming soon</span>' : `<span class="form-go">${chevron}</span>`}`;
      return soon
        ? `<li><div class="form-link soon" aria-disabled="true">${inner}</div></li>`
        : `<li><a class="form-link" href="${esc(f.href)}">${inner}</a></li>`;
    }

    document.getElementById('hub').innerHTML = FORM_GROUPS.map(g => `
      <section class="group">
        <div class="group-head">
          <h2>${esc(g.name)}</h2>
          ${g.description ? `<p>${esc(g.description)}</p>` : ''}
        </div>
        <ul class="form-list">${g.forms.map(renderForm).join('')}</ul>
      </section>`).join('');
  </script>

</body>
</html>
